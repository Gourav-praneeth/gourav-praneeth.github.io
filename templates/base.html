<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}" />
  <meta name="theme-color" content="#0f1f10" />
  <meta name="color-scheme" content="dark" />
  <link rel="canonical" href="{{ site.url }}/" />
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:site_name" content="{{ site.brand }}" />
  <meta property="og:title" content="{{ site.title }}" />
  <meta property="og:description" content="{{ site.description }}" />
  <meta property="og:url" content="{{ site.url }}/" />
  <meta property="og:image" content="{{ site.url }}/static/{{ site.social_image }}" />
  <meta property="og:image:alt" content="Portrait of {{ profile.name }}" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}" />
  <script>document.documentElement.classList.add('js');</script>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": {{ profile.name|tojson }},
      "url": {{ (site.url ~ '/')|tojson }},
      "image": {{ (site.url ~ '/static/' ~ site.social_image)|tojson }},
      "jobTitle": {{ profile.role|tojson }},
      "email": {{ ('mailto:' ~ profile.email)|tojson }},
      "sameAs": [{% for s in socials if s.url.startswith('http') %}{{ s.url|tojson }}{% if not loop.last %}, {% endif %}{% endfor %}]
    }
  </script>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a>
  {% block content %}{% endblock %}
  <script defer src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
