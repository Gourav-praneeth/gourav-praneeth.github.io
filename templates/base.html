<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}" />
  <meta name="theme-color" content="#e7ece9" />
  <meta name="color-scheme" content="light" />
  <link rel="canonical" href="{{ site.url }}/" />
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml" />

  <meta property="og:type" content="profile" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:site_name" content="{{ profile.name }}" />
  <meta property="og:title" content="{{ site.title }}" />
  <meta property="og:description" content="{{ site.description }}" />
  <meta property="og:url" content="{{ site.url }}/" />
  <meta property="og:image" content="{{ site.url }}/static/{{ site.social_image }}" />
  <meta property="og:image:alt" content="Portrait of {{ profile.name }}" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{ site.title }}" />
  <meta name="twitter:description" content="{{ site.description }}" />
  <meta name="twitter:image" content="{{ site.url }}/static/{{ site.social_image }}" />

  <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}" />
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": {{ profile.name|tojson }},
      "url": {{ (site.url ~ '/')|tojson }},
      "image": {{ (site.url ~ '/static/' ~ site.social_image)|tojson }},
      "jobTitle": {{ profile.role|tojson }},
      "email": {{ ('mailto:' ~ profile.email)|tojson }},
      "address": {"@type": "PostalAddress", "addressLocality": "Seattle", "addressRegion": "WA"},
      "sameAs": [{% for s in socials if s.url.startswith('http') %}{{ s.url|tojson }}{% if not loop.last %}, {% endif %}{% endfor %}]
    }
  </script>
</head>

<body>
  <a href="#main-content" class="skip-link">Skip to content</a>
  <div id="cursorAura" class="cursor-aura" aria-hidden="true"><span></span></div>

  <header id="siteHeader" class="site-header">
    <div class="site-frame header-inner">
      <a href="#hero" class="wordmark" aria-label="{{ profile.name }}, back to top">
        <strong>{{ profile.name }}</strong>
        <span>{{ profile.role }}</span>
      </a>

      <nav class="desktop-nav" aria-label="Primary navigation">
        <a class="nav-link" href="#work">Work</a>
        <a class="nav-link" href="#experience">Experience</a>
        <a class="nav-link" href="#capabilities">Capabilities</a>
        <a class="nav-link" href="#contact">Contact</a>
      </nav>

      <a class="header-resume" href="{{ url_for('static', filename=profile.resume_url) }}" target="_blank" rel="noopener noreferrer">
        Download résumé <span aria-hidden="true">↗</span><span class="sr-only"> (opens in a new tab)</span>
      </a>

      <button id="menuBtn" class="menu-button" type="button" aria-controls="mobileNav" aria-expanded="false">
        Menu
      </button>
    </div>
    <nav id="mobileNav" class="mobile-nav" aria-label="Mobile navigation" hidden>
      <div class="site-frame mobile-nav-inner">
        <a class="nav-link" href="#work">Work</a>
        <a class="nav-link" href="#experience">Experience</a>
        <a class="nav-link" href="#capabilities">Capabilities</a>
        <a class="nav-link" href="#contact">Contact</a>
        <a href="{{ url_for('static', filename=profile.resume_url) }}" target="_blank" rel="noopener noreferrer">Download résumé ↗</a>
      </div>
    </nav>
    <div class="scroll-progress" aria-hidden="true"><span id="scrollProgress"></span></div>
  </header>

  <main id="main-content" tabindex="-1">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="site-frame footer-inner">
      <p>© <span id="year"></span> {{ profile.name }}</p>
      <div>
        {% for s in socials %}<a href="{{ s.url }}">{{ s.label }}</a>{% endfor %}
      </div>
    </div>
  </footer>

  <script defer src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
