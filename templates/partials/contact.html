{# ---- CONTACT ---- #}
{# If a Formspree endpoint is set in data.py, the form posts to it for real.   #}
{# Otherwise the JS shows a friendly demo message so nothing looks broken.     #}
<section id="contact" class="py-12 md:py-16">
  <div class="reveal mx-auto max-w-2xl overflow-hidden rounded-2xl gilded bg-felt shadow-card">
    <div class="border-b border-gold/20 bg-slate px-6 py-5 text-center">
      <p class="section-kicker">Contact</p>
      <h2 class="mt-2 font-title text-3xl text-parchment md:text-4xl">Let's build something useful.</h2>
      <p class="mt-2 text-sm text-parchment/60">Have an interesting role, idea, or problem? Pull up a chair.</p>
    </div>

    <form id="contactForm"
          class="space-y-5 p-6"
          {% if site.formspree_endpoint %}action="{{ site.formspree_endpoint }}" method="POST"{% endif %}>
      <div class="grid gap-5 sm:grid-cols-2">
        <label class="block">
          <span class="mb-1.5 block text-sm font-semibold text-parchment/80">Name</span>
          <input required type="text" name="name" placeholder="Enter your name"
                 class="w-full rounded-lg border border-gold/25 bg-table px-4 py-3 text-parchment placeholder-parchment/30 outline-none focus:border-gold focus:ring-2 focus:ring-gold/30" />
        </label>
        <label class="block">
          <span class="mb-1.5 block text-sm font-semibold text-parchment/80">Email</span>
          <input required type="email" name="email" placeholder="you@example.com"
                 class="w-full rounded-lg border border-gold/25 bg-table px-4 py-3 text-parchment placeholder-parchment/30 outline-none focus:border-gold focus:ring-2 focus:ring-gold/30" />
        </label>
      </div>
      <label class="block">
        <span class="mb-1.5 block text-sm font-semibold text-parchment/80">Message</span>
        <textarea required name="message" rows="4" placeholder="Tell me about the problem you are working on…"
                  class="w-full rounded-lg border border-gold/25 bg-table px-4 py-3 text-parchment placeholder-parchment/30 outline-none focus:border-gold focus:ring-2 focus:ring-gold/30"></textarea>
      </label>
      <button type="submit"
              class="cta-primary inline-flex w-full items-center justify-center gap-2 rounded-lg bg-gold px-5 py-3 font-bold text-table shadow-glow transition hover:brightness-110">
        <i data-lucide="send" class="h-4 w-4"></i> Send message
      </button>
      <p id="formMsg" class="hidden text-center text-sm font-semibold text-gold"></p>
    </form>
  </div>
</section>
