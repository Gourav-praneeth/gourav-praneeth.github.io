{# ---- GUILD ENDORSEMENT: testimonial / recommendation ---- #}
<section id="endorsement" class="py-12 md:py-16">
  <div class="reveal mb-8 text-center">
    <h2 class="font-title text-3xl font-bold text-gold md:text-4xl">Guild Endorsement</h2>
    <p class="mt-2 text-parchment/60">A word from someone who's seen the work firsthand.</p>
  </div>

  <div class="reveal mx-auto max-w-3xl rounded-2xl gilded bg-felt p-8 shadow-card md:p-10">
    <i data-lucide="quote" class="h-8 w-8 text-gold/50"></i>
    <blockquote class="mt-4 text-lg italic leading-relaxed text-parchment/85">
      “{{ testimonial.quote }}”
    </blockquote>
    <div class="mt-6 flex items-center gap-3 border-t border-gold/15 pt-5">
      <span class="grid h-11 w-11 place-items-center rounded-full bg-gold/15 text-gold ring-1 ring-gold/40">
        <i data-lucide="user-round" class="h-5 w-5"></i>
      </span>
      <div>
        <div class="font-title font-bold text-parchment">{{ testimonial.author }}</div>
        <div class="text-xs text-parchment/50">{{ testimonial.role }}</div>
      </div>
    </div>
  </div>
</section>
