{# ---- TESTIMONIAL: professional recommendation ---- #}
<section id="endorsement" class="py-12 md:py-16">
  <div class="reveal mb-8 text-center">
    <h2 class="font-title text-3xl text-parchment md:text-5xl">What collaborators say</h2>
    <p class="mt-3 text-parchment/60">A perspective from someone who has seen the work firsthand.</p>
  </div>

  <div class="reveal mx-auto max-w-3xl rounded-2xl gilded bg-felt p-8 shadow-card md:p-10">
    <i data-lucide="quote" class="h-8 w-8 text-gold/50"></i>
    <blockquote class="mt-4 text-lg italic leading-relaxed text-parchment/85">
      “{{ testimonial.quote }}”
    </blockquote>
    <div class="mt-6 flex items-center gap-3 bg-table/60 p-5">
      <span class="grid h-11 w-11 place-items-center rounded-full bg-gold/15 text-gold">
        <i data-lucide="user-round" class="h-5 w-5"></i>
      </span>
      <div>
        <div class="font-title text-xl text-parchment">{{ testimonial.author }}</div>
        <div class="text-sm text-parchment/60">{{ testimonial.role }}</div>
      </div>
    </div>
  </div>
</section>
