{# ---- ABOUT: one statement and a quiet two-ended list. ---- #}
<section id="hobbies" class="about-section reveal">
  <h2>Beyond the work</h2>
  <p class="about-statement">Strategy, movement, and good stories keep me curious, connected, and open to new ways of thinking.</p>
  <dl>
    {% for h in hobbies %}
    <div><dt>{{ h.label }}</dt><dd>{{ h.note }}</dd></div>
    {% endfor %}
  </dl>
</section>
