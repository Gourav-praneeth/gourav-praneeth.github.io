{# ---- ABOUT: hobbies & interests ---- #}
<section id="hobbies" class="py-12 md:py-16">
  <div class="reveal mb-8 text-center">
    <p class="section-kicker">Beyond the terminal</p>
    <h2 class="mt-2 font-title text-3xl text-parchment md:text-5xl">A little more personality</h2>
    <p class="mt-3 text-parchment/60">The interests that keep me curious, competitive, and connected.</p>
  </div>

  <div class="grid grid-cols-2 gap-4 sm:grid-cols-4">
    {% for h in hobbies %}
    <div class="reveal flex flex-col items-center gap-3 rounded-2xl border border-gold/15 bg-felt p-6 text-center lift">
      <span class="grid h-16 w-16 place-items-center rounded-full bg-table text-gold ring-1 ring-gold/30">
        <i data-lucide="{{ h.icon }}" class="h-8 w-8"></i>
      </span>
      <div>
        <div class="font-title text-2xl text-parchment">{{ h.label }}</div>
        <div class="mt-0.5 text-xs text-parchment/50">{{ h.note }}</div>
      </div>
    </div>
    {% endfor %}
  </div>
</section>
