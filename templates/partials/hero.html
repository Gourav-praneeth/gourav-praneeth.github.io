<section id="hero" class="hero-section">
  <div class="site-frame hero-grid">
    <div class="hero-copy">
      <h1>
        <span class="hero-line"><span style="--line-index: 0">Full-stack engineer.</span></span>
        <span class="hero-line"><span style="--line-index: 1">Reliable AI products.</span></span>
      </h1>
      <p class="hero-lead hero-load" style="--load-delay: 420ms">{{ profile.intro }}</p>
      <p class="hero-targets hero-load" style="--load-delay: 500ms">{{ profile.role_targets }} · {{ profile.location }}</p>

      <div class="hero-actions hero-load" style="--load-delay: 580ms">
        <a class="button-primary" href="{{ url_for('static', filename=profile.resume_url) }}" target="_blank" rel="noopener noreferrer">
          Download résumé <span aria-hidden="true">↗</span><span class="sr-only"> (opens in a new tab)</span>
        </a>
        <a class="text-link" href="#work">View selected work <span aria-hidden="true">↓</span></a>
      </div>

      <p class="hero-availability hero-load" style="--load-delay: 660ms"><span aria-hidden="true"></span>{{ profile.availability }}</p>
    </div>

    <figure class="hero-portrait pointer-responsive hero-picture" data-pointer-shift="6">
      <picture>
        <source srcset="{{ url_for('static', filename='img/profile-cutout-420.png') }} 420w, {{ url_for('static', filename=profile.avatar_modern) }} 1024w" sizes="(min-width: 800px) 44vw, 88vw" type="image/png" />
        <img src="{{ url_for('static', filename=profile.avatar) }}" alt="Gourav Bhimavarapu, full-stack and applied AI engineer" width="1024" height="1535" fetchpriority="high" decoding="async" />
      </picture>
    </figure>
  </div>

  <div class="site-frame hero-proof" aria-label="Selected proof">
    {% for metric in profile.metrics %}
    <div>
      <strong>{{ metric.value }}</strong>
      <span>{{ metric.label }}</span>
    </div>
    {% endfor %}
  </div>
</section>
